<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB SUPREME</title>
    <link href="https://fonts.googleapis.com/css?family=UnifrakturCook:700" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .title {
            font-size: 4rem;
            font-family: 'Britannic Bold', Arial Black, sans-serif;
            color: white;
            letter-spacing: 0.15em;
            text-align: center;
            margin-bottom: 2rem;
        }
        .clock {
            font-family: 'UnifrakturCook', cursive;
            font-size: 72px;
            color: gold;
            text-align: center;
            text-shadow: 2px 2px 10px #816608;
            margin-bottom: 2rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="title">WEB SUPREME</div>
    <div class="clock" id="clock">00:00:00 AM</div>
    <script>
        function updateClock() {
            const now = new Date();
            let hour = now.getHours();
            let min = now.getMinutes();
            let sec = now.getSeconds();
            const ampm = hour >= 12 ? 'PM' : 'AM';
            hour = hour % 12;
            hour = hour ? hour : 12; // the hour '0' should be '12'
            const timeString = `${hour.toString().padStart(2,'0')}:${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')} ${ampm}`;
            document.getElementById('clock').textContent = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
